# Publishes the container image to GitHub Container Registry after the .NET workflow passes on master.
# Deploying a new image to Azure Container Apps is manual: see docs/deploy-azure-container-apps.md.

name: Container

on:
  workflow_run:
    workflows: [ ".NET" ]
    types: [ completed ]
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    - name: Image name
      id: image
      run: |
        echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ steps.image.outputs.name }}:latest
          ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
